name: Remote access rules

on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/remote-access-rules.yaml
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/kustomization.yaml
      - .github/scripts/test_remote_access_rules.py
      - .github/workflows/remote-access-rules.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: arduino/setup-task@v1
        with:
          version: 3.x
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Render the bastion victoria-metrics overlay
        run: |
          task apps:overlays:render project=monitoring namespace=monitoring app=victoria-metrics cluster=bastion > /tmp/monitoring.yaml
      - name: Test remote-access downtime rules
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/test_remote_access_rules.py /tmp/monitoring.yaml /tmp/remote-access-fixtures
          docker run --rm --network none --entrypoint /bin/promtool \
            -v /tmp/remote-access-fixtures:/fixtures:ro \
            prom/prometheus:v3.5.0 check rules /fixtures/rules.yml
          docker run --rm --network none --entrypoint /bin/promtool \
            -v /tmp/remote-access-fixtures:/fixtures:ro \
            prom/prometheus:v3.5.0 test rules /fixtures/tests.yml
