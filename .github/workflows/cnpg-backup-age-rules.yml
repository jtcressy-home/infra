name: CNPG backup age rules

on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/cnpg-backup-age-rules.yaml
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/kustomization.yaml
      - .github/scripts/test_cnpg_backup_age.py
      - .github/workflows/cnpg-backup-age-rules.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: arduino/setup-task@v1
        with:
          version: 3.x
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Render the bastion victoria-metrics overlay
        run: task apps:overlays:render project=monitoring namespace=monitoring app=victoria-metrics cluster=bastion > /tmp/monitoring.yaml
      - name: Unit test CNPG backup age rules
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/test_cnpg_backup_age.py /tmp/monitoring.yaml /tmp/cnpg-backup-fixtures
          docker run --rm --network none --entrypoint /bin/promtool \
            -v /tmp/cnpg-backup-fixtures:/fixtures:ro \
            prom/prometheus:v3.5.0 check rules /fixtures/rules.yml
          docker run --rm --network none --entrypoint /bin/promtool \
            -v /tmp/cnpg-backup-fixtures:/fixtures:ro \
            prom/prometheus:v3.5.0 test rules /fixtures/tests.yml
