name: Media apps down rules

on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/media-apps-down-rules.yaml
      - kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion/kustomization.yaml
      - .github/scripts/test_media_apps_down.py
      - .github/workflows/media-apps-down-rules.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Render the bastion victoria-metrics overlay
        run: |
          kustomize build --enable-helm kubernetes/deploy/monitoring/monitoring/victoria-metrics/clusters/bastion > /tmp/monitoring.yaml
      - name: Unit-test media app availability rules
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/test_media_apps_down.py /tmp/monitoring.yaml /tmp/media-fixtures
          docker run --rm --network none --entrypoint /bin/promtool \
            -v /tmp/media-fixtures:/fixtures:ro \
            prom/prometheus:v3.5.0 test rules /fixtures/tests.yml
