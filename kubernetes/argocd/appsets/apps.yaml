apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  # syncPolicy controls how the ApplicationSet manages Application resources
  # 'sync' (default): Allows create, update, and delete operations
  # This ensures git is the source of truth - when overlays move to disabled/,
  # the corresponding Applications are automatically deleted from ArgoCD
  # preserveResourcesOnDeletion prevents Application deletion from cascading
  # to workload resources (2026-07-13 incident: a malformed commit briefly
  # emptied the repo and the ApplicationSet cascade-deleted live workloads,
  # CNPG databases, and PVCs). Intentionally removing an app's resources now
  # requires an explicit cascade delete after disabling the overlay:
  #   kubectl delete application <app> -n argocd --cascade=foreground
  syncPolicy:
    applicationsSync: sync  # Changed from create-update
    preserveResourcesOnDeletion: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  goTemplate: true
  # goTemplateOptions:
  # - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/jtcressy-home/infra
      revision: HEAD
      directories:
      - path: 'kubernetes/deploy/*/*/*/clusters/*'
      - path: 'kubernetes/deploy/*/*/*/clusters/_all'
        exclude: true # to be handled by next generator
      values:
        # project: '{{ index .path.segments 2 }}'
        # namespace: '{{ index .path.segments 3 }}'
        # app: '{{ index .path.segments 4 }}'
        cluster: '{{ index .path.segments 6 }}'
  - matrix:
      generators:
      - clusters:
          values:
            cluster: '{{ .name }}'
      - git:
          repoURL: https://github.com/jtcressy-home/infra
          revision: HEAD
          directories:
          - path: 'kubernetes/deploy/*/*/*/clusters/_all'
          # values:
          #   project: '{{ index .path.segments 2 }}'
          #   namespace: '{{ index .path.segments 3 }}'
          #   app: '{{ index .path.segments 4 }}'
          #   cluster: '{{ .name }}'
  template:
    metadata:
      name: '{{ index .path.segments 4 }}-{{ .values.cluster }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "."
        debug: '{{ . }}'
    spec:
      project: '{{ index .path.segments 2 }}'
      source:
        repoURL: https://github.com/jtcressy-home/infra
        targetRevision: HEAD
        path: '{{.path.path}}'
        kustomize:
          namespace: '{{ index .path.segments 3 }}'
      destination:
        namespace: '{{ index .path.segments 3 }}'
        name: '{{ .values.cluster }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
        - /spec/conversion/webhook/clientConfig
      - group: '*'
        kind: '*'
        managedFieldsManagers:
        - kube-webhook-certgen
      - group: storage.k8s.io
        kind: CSIDriver
        jsonPointers: # https://github.com/argoproj/argo-cd/issues/13585
          - /spec/seLinuxMount
  # victoria-metrics-bastion only: core manifests stay on the kustomize source,
  # and VMRules come from <overlay>/rules via a directory include. New alerts are
  # files in that directory; do not add them to kustomization.yaml.
  #
  # Every other app renders an empty patch. ApplicationSet treats that as a no-op,
  # so those apps keep spec.source.kustomize. source is cleared only for this app
  # because spec.source and spec.sources cannot both be set.
  #
  # argocd.argoproj.io/manifest-generate-paths stays ".". Argo CD joins that
  # relative path onto every source path, so a commit under the overlay or under
  # overlay/rules still refreshes victoria-metrics-bastion and no other app.
  templatePatch: |
    {{- if and (eq (index .path.segments 4) "victoria-metrics") (eq (index .path.segments 6) "bastion") }}
    spec:
      source: null
      sources:
        - repoURL: https://github.com/jtcressy-home/infra
          targetRevision: HEAD
          path: '{{.path.path}}'
          kustomize:
            namespace: '{{ index .path.segments 3 }}'
        - repoURL: https://github.com/jtcressy-home/infra
          targetRevision: HEAD
          path: '{{.path.path}}/rules'
          directory:
            recurse: true
            include: '*-rules.yaml'
    {{- end }}
