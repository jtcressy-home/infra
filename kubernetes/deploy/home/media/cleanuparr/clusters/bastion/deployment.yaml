---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  labels:
    app.kubernetes.io/name: cleanuparr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cleanuparr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanuparr
    spec:
      # 2.10.12 entrypoint.sh skips gosu when uid is not 0 and requires a
      # writable /config. SQLite, logs, and data-protection keys stay on the
      # PVC. /tmp holds the single-file bundle extract.
      #
      # SAB writes completed job dirs as uid/gid 568, mode 775 (files 664).
      # This pod is already that uid and primary gid, so it can unlink those
      # files. supplementalGroups repeats 568 so the shared group is explicit.
      # 65536 is not added: Sonarr and Lidarr mount this same NFS export as
      # uid/gid 568 without it, and git has no export ownership for 65536.
      # fsGroup 568 is unchanged (config PVC). SAB already uses that same
      # fsGroup on this subPath. No fsGroup was added for the share.
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
      containers:
        - name: cleanuparr
          image: ghcr.io/cleanuparr/cleanuparr:2.11.2@sha256:4093c0eb48c1926ef375e672f05ea804aacbe7d0900d203cc8716880ccf5a1df
          ports:
            - containerPort: 11011
              name: http
          env:
            - name: PORT
              value: "11011"
            - name: TZ
              value: America/Chicago
            - name: UMASK
              value: "022"
            # Ignored while runAsUser is set. Kept aligned with uid 568 so a
            # root entrypoint would not chown /config to the image default 1000.
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: HOME
              value: /tmp
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            # Downloads only. Orphaned Files Cleaner and Malware Blocker
            # delete files here, so the mount is read-write. No movies, tv,
            # or other library subPath.
            - name: downloads
              mountPath: /media/downloads/nzbs
              subPath: downloads/nzbs
              readOnly: false
            # Directory mount, not subPath, so a ConfigMap update is visible
            # without a restart. Cleanuparr reloads this file every 5 minutes.
            - name: blocklist
              mountPath: /blocklists
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 11011
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 11011
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 11011
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr
        - name: tmp
          emptyDir: {}
        - name: downloads
          persistentVolumeClaim:
            claimName: purplebox-nfs-media
        # Name matches the configMapGenerator. Kustomize rewrites it to the
        # hashed ConfigMap name.
        - name: blocklist
          configMap:
            name: cleanuparr-blocklist
