---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr-restic
  annotations:
    # Same wave as the PVC. The destination restore needs this secret
    # before the claim can leave Pending.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-restic-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .REPOSITORY_TEMPLATE }}/cleanuparr"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-template
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cleanuparr
  annotations:
    # Wave -1, with the ReplicationDestination that populates it. The
    # Deployment stays on wave 0, so it is not created while this claim is
    # still Pending. Same-wave apply hits the default progress deadline on
    # first sync. argocd-cm ignoreResourceUpdates.all then drops /status,
    # and a Degraded-to-Healthy transition that lands during an in-flight
    # reconcile is not replayed. The next sync of this annotation
    # recomputes Application health from the live objects.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: ["ReadWriteOnce"]
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: cleanuparr-rdst
  resources:
    requests:
      storage: 2Gi
  storageClassName: zfs-nvme
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: cleanuparr-rdst
  annotations:
    # Same wave as the PVC. The claim stays Pending until this restore
    # publishes status.latestImage.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  trigger:
    manual: restore-zfs-snapshot
  restic:
    repository: cleanuparr-restic-secret
    copyMethod: Snapshot
    accessModes: ["ReadWriteOnce"]
    storageClassName: zfs-nvme
    cacheStorageClassName: zfs-nvme
    volumeSnapshotClassName: zfs-nvme-snapshot
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    capacity: 2Gi # must match the PersistentVolumeClaim `.resources.requests.storage` size above
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: cleanuparr-rsrc
spec:
  sourcePVC: cleanuparr
  trigger:
    schedule: "15 */8 * * *"
  restic:
    pruneIntervalDays: 7
    repository: cleanuparr-restic-secret
    copyMethod: Snapshot
    accessModes: ["ReadWriteOnce"]
    storageClassName: zfs-nvme
    cacheStorageClassName: zfs-nvme
    volumeSnapshotClassName: zfs-nvme-snapshot
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    retain:
      hourly: 24
      daily: 7
      weekly: 5
