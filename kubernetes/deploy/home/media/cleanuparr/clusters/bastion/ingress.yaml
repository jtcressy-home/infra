---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleanuparr
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - cleanuparr
  rules:
    - host: cleanuparr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cleanuparr
                port:
                  number: 11011
