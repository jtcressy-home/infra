---
# 2.10.12 does not read these variables. The first admin is created in the UI,
# and the secret is still not mounted.
#
# Item DOYLE_WEBHOOK_URL holds a URL and a key. Field labels are not verified.
# dataFrom extract copies every field, rewritten to DOYLE_WEBHOOK_URL_<label>,
# so a wrong label does not fail this sync. A template key that names one
# label would. Owner replaces secret data each reconcile, so the extract stays
# on this resource; a second ExternalSecret's keys would be wiped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-secret
    creationPolicy: Owner
  data:
    - secretKey: CLEANUPARR_ADMIN_USER
      remoteRef:
        key: cleanuparr
        property: username
    - secretKey: CLEANUPARR_ADMIN_PASS
      remoteRef:
        key: cleanuparr
        property: password
  dataFrom:
    - extract:
        key: DOYLE_WEBHOOK_URL
        conversionStrategy: Default
      rewrite:
        - regexp:
            source: "(.*)"
            target: "DOYLE_WEBHOOK_URL_$1"
---
# Not mounted. *arr keys are entered in the Cleanuparr UI. This secret is a
# CASE convenience copy of the keys already stored on the source items.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr-arr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-arr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
    - extract:
        key: lidarr
