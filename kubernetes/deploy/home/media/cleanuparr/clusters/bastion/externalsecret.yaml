---
# 2.10.12 does not read these variables. The first admin is created in the UI,
# and the secret is still not mounted.
#
# Webhook URL and key are fields on item grokbot-doyle-webhooks in vault
# jtcressy-net-infra, section CLEANUPARR. The Connect provider matches the
# field label, so the section title is not part of remoteRef.property.
# These stay on this Owner resource with the admin keys. Owner replaces
# secret data each reconcile, so a second ExternalSecret's keys would be wiped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-secret
    creationPolicy: Owner
  data:
    - secretKey: CLEANUPARR_ADMIN_USER
      remoteRef:
        key: cleanuparr
        property: username
    - secretKey: CLEANUPARR_ADMIN_PASS
      remoteRef:
        key: cleanuparr
        property: password
    - secretKey: DOYLE_WEBHOOK_URL
      remoteRef:
        key: grokbot-doyle-webhooks
        property: cleanuparr_url
    - secretKey: DOYLE_WEBHOOK_KEY
      remoteRef:
        key: grokbot-doyle-webhooks
        property: cleanuparr_key
---
# Not mounted. *arr keys are entered in the Cleanuparr UI. This secret is a
# CASE convenience copy of the keys already stored on the source items.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr-arr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-arr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
    - extract:
        key: lidarr
