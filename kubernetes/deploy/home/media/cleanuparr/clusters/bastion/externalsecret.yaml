---
# 2.10.12 does not read these variables. The first admin is created in the UI,
# and the secret is still not mounted. Joel's Connect-vault Login uses
# username/password (not custom field names). CLEANUPARR_API_KEY and
# DOYLE_WEBHOOK_URL stay out until those 1Password fields exist; a missing
# template key fails sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLEANUPARR_ADMIN_USER: "{{ .username }}"
        CLEANUPARR_ADMIN_PASS: "{{ .password }}"
  dataFrom:
    - extract:
        key: cleanuparr
---
# Not mounted. *arr keys are entered in the Cleanuparr UI. This secret is a
# CASE convenience copy of the keys already stored on the source items.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr-arr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-arr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
    - extract:
        key: lidarr
