---
# Serves the Usenet malware list in-cluster. A sidecar on the Cleanuparr pod
# would share that pod's NFS mount and Recreate cycle, and its URL would be
# localhost. This Deployment is separate so Cleanuparr's settings, secret,
# and media mount stay unchanged, and the Service DNS name stays stable.
#
# nginx/nginx-unprivileged 1.30.8 runs as uid 101 and listens on 8080.
# blocklist/nginx.conf turns sendfile and gzip off so the response body is
# the ConfigMap file. command skips the image entrypoint, which writes
# under /etc/nginx and cannot run on a read-only root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr-blocklist
  labels:
    app.kubernetes.io/name: cleanuparr-blocklist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cleanuparr-blocklist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanuparr-blocklist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: docker.io/nginx/nginx-unprivileged:1.30.8-alpine-slim@sha256:04c98c78c1de60ddeada00d7d2207dcd146ecd07b61b9941c9a5799cfb258d28
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: blocklist
              mountPath: /usr/share/nginx/html/usenet-malware.txt
              subPath: usenet-malware.txt
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /usenet-malware.txt
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /usenet-malware.txt
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: cleanuparr-blocklist
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: blocklist
          configMap:
            name: cleanuparr-blocklist
            items:
              - key: usenet-malware.txt
                path: usenet-malware.txt
        - name: tmp
          emptyDir: {}
