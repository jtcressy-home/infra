---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.2.0/charts/other/app-template/values.schema.json

controllers:
  sabnzbd:
    pod:
      terminationGracePeriodSeconds: 120
    initContainers:
      # ghcr.io/home-operations/sabnzbd entrypoint.sh (image rev f5f7db86,
      # SABnzbd 5.1.2) writes SABNZBD__API_KEY, SABNZBD__NZB_KEY,
      # SABNZBD__HOST_WHITELIST_ENTRIES, and SABNZBD__LOCAL_RANGES_ENTRIES only.
      # An empty misc.permissions leaves completed job folders at mode 700.
      # purplebox-nfs-media is NFSv3, and new completed dirs land as 568:0
      # because the NFS server sets gid 0. 775 is group-writable only for that
      # directory's group, so Radarr (uid 1000, supplementalGroups 568) never
      # gets write. 777 is other-writable regardless of gid; SABnzbd strips the
      # execute bit on files (666). A cleaner fix (chgrp 568 and g+s, or the
      # export's mapall group) is a NAS change outside this repo.
      permissions:
        image:
          repository: ghcr.io/home-operations/sabnzbd
          tag: rolling@sha256:8172dc78c4e70baf88b18afca851bf77487e2e22802a6bd3502d7ef211dfb8fd
        env:
          SABNZBD__PERMISSIONS: &completedPermissions "777"
        command:
          - /bin/bash
          - -ec
          - |
            mode="${SABNZBD__PERMISSIONS:?SABNZBD__PERMISSIONS is required}"
            case "$mode" in
              [0-7][0-7][0-7]|[0-7][0-7][0-7][0-7]) ;;
              *)
                echo "SABNZBD__PERMISSIONS must be 3 or 4 octal digits" >&2
                exit 1
                ;;
            esac
            ini=/config/sabnzbd.ini
            if [[ ! -f "$ini" ]]; then
              cp /defaults/sabnzbd.ini "$ini"
            fi
            if grep -q '^permissions *=' "$ini"; then
              sed -i -e "s|^permissions *=.*$|permissions = ${mode}|" "$ini"
            else
              sed -i -e "/^\[misc\]/a permissions = ${mode}" "$ini"
            fi
            grep -q "^permissions = ${mode}$" "$ini"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    containers:
      # temp:
      #   image:
      #     repository: alpine
      #     tag: latest
      #   command:
      #     - /bin/sh
      #     - -c
      #     - sleep 3600;
      app:
        image:
          repository: ghcr.io/home-operations/sabnzbd
          tag: rolling@sha256:8172dc78c4e70baf88b18afca851bf77487e2e22802a6bd3502d7ef211dfb8fd
        env:
          # Written into sabnzbd.ini by the permissions initContainer. This
          # image's entrypoint does not map SABNZBD__PERMISSIONS itself.
          SABNZBD__PERMISSIONS: *completedPermissions
          SABNZBD__PORT: &port 8080
          SABNZBD__HOST_WHITELIST_ENTRIES: >-
            sabnzbd,
            sabnzbd.media,
            sabnzbd.media.svc,
            sabnzbd.media.svc.cluster,
            sabnzbd.media.svc.cluster.local,
            downloads.media.cressy.family,
            sabnzbd.tailnet-4d89.ts.net
          TZ: America/Chicago
        envFrom:
          - secretRef:
              name: sabnzbd-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api?mode=version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
defaultPodOptions:
  # nodeSelector:
  #   kubernetes.io/hostname: talos-master-0
  #   # this node is always on the same proxmox host as truenas-purplebox,
  #   # which gives it more bandwidth until we upgrade to 10GbE networking
  securityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 65536
persistence:
  config:
    existingClaim: &app sabnzbd
  logs:
    type: emptyDir
    globalMounts:
      - path: /config/logs
  download-temp:
    enabled: false
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 512Gi
    storageClass: cephfs
    globalMounts:
      - path: /media/downloads/nzbs/incomplete
  media:
    existingClaim: purplebox-nfs-media
    globalMounts:
      - path: /media/downloads/nzbs
        subPath: downloads/nzbs
  tmp:
    type: emptyDir
ingress:
  app:
    enabled: true
    className: tailscale
    hosts:
      - host: *app
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - *app
service:
  app:
    controller: *app
    ports:
      http:
        port: *port
