apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplyprint-client
  labels:
    app.kubernetes.io/name: simplyprint-client
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: simplyprint-client
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "macvlan-conf-dhcp",
              "namespace": "kube-system",
              "interface": "eth1",
              "mac": "02:73:69:6d:70:01"
            }
          ]
      labels:
        app.kubernetes.io/name: simplyprint-client
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simplyprint-client
          image: docker.io/simplyprint/simplyprint-client:production-stable@sha256:1c483decae710aaf661c5e9d484e4173e2879360f4ead62254717d4b3e5c1b86
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /root/.config/SimplyPrint
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: simplyprint-client
