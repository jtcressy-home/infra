---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # Recreate is mandatory: the RWO hermes-data PVC plus upstream's own
  # "never run two gateways against the same data dir" warning means a
  # RollingUpdate would deadlock trying to schedule a second pod against a
  # volume the first pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
      # The image's own privilege model is root-init-then-drop: s6-overlay's
      # /init runs as root to fix volume ownership, then s6-setuidgid drops
      # the supervised gateway process to UID 10000. Do NOT set
      # runAsNonRoot/runAsUser here — that would break the chown phase and
      # the gateway would never start. HERMES_ALLOW_ROOT_GATEWAY is
      # deliberately left unset so the gateway process itself still refuses
      # to run as root; only /init is privileged.
      initContainers:
        - name: seed-env
          image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              cp /env/.env /opt/data/.env
              chown 10000:10000 /opt/data/.env
              chmod 600 /opt/data/.env
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-env
              mountPath: /env
              readOnly: true
        - name: acp-deps
          image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          command: [sh, -ec]
          args:
            - |
              cp /config/package.json /config/package-lock.json /opt/acp/
              npm ci --prefix /opt/acp --omit=dev --ignore-scripts --no-audit --no-fund
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          volumeMounts:
            - name: acp-config
              mountPath: /config
              readOnly: true
            - name: acp-deps
              mountPath: /opt/acp
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          # Pass the gateway subcommand as the container CMD; the image
          # entrypoint (/init + main-wrapper.sh) turns this into
          # `hermes gateway run`. Without it the wrapper launches the
          # interactive CLI, which exits immediately on a non-TTY stdin.
          args: ["gateway", "run"]
          env:
            # User-installed tools persist on the data PVC. Keep that location
            # first while retaining the image's standard system search paths.
            - name: PATH
              value: /opt/data/.local/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HERMES_UID
              value: "10000"
            # The dashboard runs as a separate s6 `with-contenv` service whose
            # run/finish scripts gate on HERMES_DASHBOARD from the shell env —
            # NOT from /opt/data/.env (that file is read only by the Python
            # process). Without this as a real container env var the wrapper
            # treats the dashboard as disabled: run exits immediately and
            # finish exits 125, so s6 marks it permanently down and 9119 never
            # binds (ingress → 502). Keep it here, not only in the ESO .env.
            - name: HERMES_DASHBOARD
              value: "1"
            # mem0 self-hosted memory backend runs from deps
            # (mem0ai/psycopg2/ollama) delivered by the read-only `mem0-deps`
            # image volume mounted at /opt/mem0-deps, with packages in
            # its pydeps subdirectory (built by
            # ghcr.io/jtcressy/hermes-mem0-deps). PYTHONPATH lets the gateway's
            # Python import them. This replaces the former PVC-resident install
            # at /opt/data/pydeps so the deps are durable and reproducible from
            # Git. Only $HERMES_HOME/mem0.json remains PVC-resident runtime
            # state; the deps are no longer baked into or written to the PVC.
            - name: PYTHONPATH
              value: /opt/mem0-deps/pydeps
            # mem0ai phones home to PostHog by default; disable it so nothing
            # about memory contents or usage leaves the network.
            - name: MEM0_TELEMETRY
              value: "False"
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            # Read-only image volume carrying the mem0 Python deps. Mounted
            # outside /opt/data because an image volume cannot overlay a
            # subdirectory of the RWO PVC mounted there.
            - name: mem0-deps
              mountPath: /opt/mem0-deps
              readOnly: true
          # TCP-only: the exact HTTP health path on 8642 isn't confirmed
          # upstream, but API_SERVER_ENABLED=true + API_SERVER_HOST=0.0.0.0
          # (set in the rendered .env) guarantee the port binds beyond
          # loopback, so a TCP probe unambiguously proves the API server is
          # up without needing the bearer key.
          startupProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 5
            failureThreshold: 60 # s6 boot + PVC chown + first-run model/browser init
          livenessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 10
            failureThreshold: 3
        # Shares the existing Hermes home and provider credentials. This runs
        # ACP only, never a second gateway against the same data directory.
        - name: acp-bridge
          image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          command: [node, /config/launch.mjs]
          workingDir: /opt/data
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
            - name: PATH
              value: /opt/data/.local/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: PYTHONPATH
              value: /opt/mem0-deps/pydeps
            - name: MEM0_TELEMETRY
              value: "False"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8766
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: mem0-deps
              mountPath: /opt/mem0-deps
              readOnly: true
            - name: acp-config
              mountPath: /config
              readOnly: true
            - name: acp-deps
              mountPath: /opt/acp
              readOnly: true
        - name: acp-auth
          image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:e75f89810bf5bfbcf58a1cfb32a1a11de55b7623d732e67735d513b720d7436a
          command: [sh, -ec]
          args:
            - |
              # Fail closed before rendering nginx config, including on an
              # empty or malformed bootstrap Secret. Never echo the token.
              case "$ACP_BEARER_TOKEN" in
                ""|*[!A-Za-z0-9_-]*) exit 1 ;;
              esac
              test "${#ACP_BEARER_TOKEN}" -ge 43
              envsubst '$ACP_BEARER_TOKEN' < /config/nginx.conf.template > /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ACP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-acp-auth
                  key: bearer-token
          ports:
            - name: acp
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /healthz
              port: acp
          livenessProbe:
            httpGet:
              path: /healthz
              port: acp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: acp-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: acp-config
          configMap:
            name: hermes-acp-config
        - name: acp-deps
          emptyDir: {}
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        # Durable, reproducible mem0 deps delivered as a Kubernetes image
        # volume (beta-default on k8s 1.34 / containerd 2.1). Built by the
        # containers repo (ghcr.io/jtcressy/hermes-mem0-deps). Digest-pinned to
        # the first published `rolling` build; Renovate bumps the digest.
        - name: mem0-deps
          image:
            reference: ghcr.io/jtcressy/hermes-mem0-deps:rolling@sha256:f75febc9c9d67ea359d72ff4ba264902ba75fcd021ba845cddadb2cce42367e2
            pullPolicy: IfNotPresent
        - name: hermes-env
          secret:
            secretName: hermes-env
