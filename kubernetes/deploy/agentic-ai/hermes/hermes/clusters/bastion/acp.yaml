---
apiVersion: v1
kind: Service
metadata:
  name: hermes-acp
spec:
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: acp
      port: 8765
      targetPort: acp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-acp
  annotations:
    link.argocd.argoproj.io/external-link: https://hermes-acp.tailnet-4d89.ts.net
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes-acp
  rules:
    - host: hermes-acp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-acp
                port:
                  name: acp
