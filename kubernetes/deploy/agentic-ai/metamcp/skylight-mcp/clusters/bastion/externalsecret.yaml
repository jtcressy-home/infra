apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skylight-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: skylight-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Deployed ESO is v2.10.0, which still has Sprig fail. v2.12+ removes
        # fail, so a quote or newline is rejected by reading a missing key.
        # missingkey=error fails the sync and the error names that key.
        skylight.env: |
          {{ if or (contains "'" .SKYLIGHT_PASSWORD) (contains "\n" .SKYLIGHT_PASSWORD) }}{{ .ERROR_SKYLIGHT_PASSWORD_HAS_QUOTE_OR_NEWLINE }}{{ end }}
          SKYLIGHT_EMAIL='{{ .SKYLIGHT_EMAIL }}'
          SKYLIGHT_PASSWORD='{{ .SKYLIGHT_PASSWORD }}'
  data:
    - secretKey: SKYLIGHT_EMAIL
      remoteRef:
        key: app.ourskylight.com
        property: username
    - secretKey: SKYLIGHT_PASSWORD
      remoteRef:
        key: app.ourskylight.com
        property: password
