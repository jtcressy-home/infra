apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skylight-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: skylight-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # v2 templates use missingkey=error, so the optional frame id is read
        # with index. Current ESO v2 docs exclude Sprig fail (removed in
        # v2.12.0), so this template cannot reject a password that contains
        # a single quote or a newline. Those characters break this dotenv file.
        skylight.env: |
          SKYLIGHT_EMAIL='{{ .SKYLIGHT_EMAIL }}'
          SKYLIGHT_PASSWORD='{{ .SKYLIGHT_PASSWORD }}'
          {{ $frameID := index . "SKYLIGHT_FRAME_ID" }}{{ if $frameID }}SKYLIGHT_FRAME_ID='{{ $frameID }}'{{ end }}
  dataFrom:
    - extract:
        key: skylight-mcp
