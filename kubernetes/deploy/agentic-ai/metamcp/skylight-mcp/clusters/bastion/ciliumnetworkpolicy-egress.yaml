# Egress is default-deny once this policy selects the pod.
# DNS is proxied so toFQDNs can learn addresses. Cilium 1.16 wildcards match
# a single label, so S3 is *.s3.*.amazonaws.com rather than *.amazonaws.com.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: skylight-mcp-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: skylight-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: app.ourskylight.com
        - matchPattern: "*.s3.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
