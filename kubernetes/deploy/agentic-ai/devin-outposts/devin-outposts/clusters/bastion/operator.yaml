      port: 8080
      targetPort: metrics
---
# Source: devin-outposts-k8s/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devin-outposts
  namespace: devin-outposts
  labels:
    helm.sh/chart: devin-outposts-k8s-0.1.0
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devin-outposts-k8s
      app.kubernetes.io/instance: devin-outposts
  template:
    metadata:
      labels:
        helm.sh/chart: devin-outposts-k8s-0.1.0
        app.kubernetes.io/name: devin-outposts-k8s
        app.kubernetes.io/instance: devin-outposts
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: devin-outposts
      containers:
        - name: operator
          image: "ghcr.io/cognitionai/devin-outposts-k8s:latest"
          imagePullPolicy: Always
          env:
            # Downward API identity for leader election + the acceptor-ID
            # ConfigMap's namespace.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_ADDR
              value: ":8080"
            - name: WATCH_NAMESPACE
              value: ""
            - name: DEVIN_API_URL
              value: "https://api.devin.ai"
            - name: DEVIN_WORKER_IMAGE
              value: "public.ecr.aws/e0h8a4b6/devin-cli:stable"
            - name: ACCEPTOR_ID
              value: ""
            - name: LOG_FORMAT
              value: "text"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
