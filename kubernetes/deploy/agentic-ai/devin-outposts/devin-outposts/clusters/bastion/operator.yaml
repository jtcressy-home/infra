---
# Source: devin-outposts-k8s/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devin-outposts
  namespace: devin-outposts
  labels:
    helm.sh/chart: devin-outposts-k8s-0.1.0
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: devin-outposts-k8s/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devin-outposts
  labels:
    helm.sh/chart: devin-outposts-k8s-0.1.0
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  # Reconcile the operator's own custom resources + status.
  - apiGroups: ["outposts.cognition.com"]
    resources: ["outpostpools", "outpostpools/status", "outpostpools/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Manage one worker Pod per claimed session.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Read the per-pool token Secret; create/delete the per-session connect-token
  # Secrets injected into worker pods.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Persist the generated acceptor ID (when operator.acceptorId is unset).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Leader election (see the elector docs).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Retained per-session state volumes (FilesystemSnapshot resume policy).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # GKE pod snapshots (GkeSnapshot resume policy). Absent from non-GKE
  # clusters; the rule is inert there.
  - apiGroups: ["podsnapshot.gke.io"]
    resources: ["podsnapshotpolicies", "podsnapshotmanualtriggers", "podsnapshots"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
# Source: devin-outposts-k8s/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devin-outposts
  labels:
    helm.sh/chart: devin-outposts-k8s-0.1.0
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devin-outposts
subjects:
  - kind: ServiceAccount
    name: devin-outposts
    namespace: devin-outposts
---
# Source: devin-outposts-k8s/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: devin-outposts-metrics
  namespace: devin-outposts
  labels:
    helm.sh/chart: devin-outposts-k8s-0.1.0
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devin-outposts-k8s
    app.kubernetes.io/instance: devin-outposts
