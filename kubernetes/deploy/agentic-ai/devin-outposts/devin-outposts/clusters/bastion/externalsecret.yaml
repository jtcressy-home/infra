---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devin-outposts-pool-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: devin-outposts-pool-token
    creationPolicy: Owner
  data:
    # Service account token (cog_...) shown once when creating the Outpost
    # under Settings -> Environment -> Outposts in the Devin web app.
    - secretKey: token
      remoteRef:
        key: devin-outposts
        property: token
