apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: media-web-ingress
spec:
  statefulSet:
    pod:
      nodeSelector:
        beta.kubernetes.io/os: "linux"
      tailscaleContainer:
        image: tailscale/tailscale:v1.104.4
        env:
          - name: TS_USERSPACE
            value: "false"
          - name: TS_DEBUG_DISABLE_UDP_GSO
            value: "true"
          - name: TS_DEBUG_MTU
            value: "1220"
        securityContext:
          privileged: true
        resources:
          limits:
            devic.es/tun: "1"
          requests:
            cpu: "1m"
            memory: "1Mi"
            devic.es/tun: "1"
