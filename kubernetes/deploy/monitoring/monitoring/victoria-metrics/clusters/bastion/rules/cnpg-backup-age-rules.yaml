---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cnpg-backup-age
  namespace: monitoring
spec:
  groups:
    - name: cnpg-backup-age
      interval: 1m
      rules:
        # ScheduledBackup is daily just after midnight UTC. 30h is six hours past one missed run.
        - alert: CNPGBackupTooOld
          expr: 'time() - cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion"} > 30*3600'
          for: 30m
          labels:
            k8s_cluster: bastion
            severity: warning
            irm_notify: "true"
          annotations:
            summary: CNPG backup for {{ $labels.job }} is older than 30 hours
            description: The last available backup for {{ $labels.job }} is more than 30 hours old and has remained so for 30 minutes. Daily backups run just after midnight UTC. Check the ScheduledBackup and the object-store destination.
        # absent() drops series labels, so each database keeps an explicit identity.
        # A missing series would otherwise clear CNPGBackupTooOld without paging.
        - alert: CNPGBackupMetricAbsent
          expr: absent(cnpg_collector_last_available_backup_timestamp{namespace="dograh"})
          for: 1h
          labels:
            k8s_cluster: bastion
            namespace: dograh
            job: dograh/dograh-db
            severity: warning
            irm_notify: "true"
          annotations:
            summary: CNPG backup metric missing for dograh/dograh-db
            description: cnpg_collector_last_available_backup_timestamp has been absent for dograh/dograh-db for one hour, so backup age cannot be evaluated.
        - alert: CNPGBackupMetricAbsent
          expr: absent(cnpg_collector_last_available_backup_timestamp{namespace="kagent"})
          for: 1h
          labels:
            k8s_cluster: bastion
            namespace: kagent
            job: kagent/kagent-db
            severity: warning
            irm_notify: "true"
          annotations:
            summary: CNPG backup metric missing for kagent/kagent-db
            description: cnpg_collector_last_available_backup_timestamp has been absent for kagent/kagent-db for one hour, so backup age cannot be evaluated.
        - alert: CNPGBackupMetricAbsent
          expr: absent(cnpg_collector_last_available_backup_timestamp{namespace="teslamate"})
          for: 1h
          labels:
            k8s_cluster: bastion
            namespace: teslamate
            job: teslamate/teslamate-db
            severity: warning
            irm_notify: "true"
          annotations:
            summary: CNPG backup metric missing for teslamate/teslamate-db
            description: cnpg_collector_last_available_backup_timestamp has been absent for teslamate/teslamate-db for one hour, so backup age cannot be evaluated.
