# Promtool unit tests for cnpg-backup-age-rules.yaml.
# Omit rule_files. test/vmrules injects the VMRule groups.
evaluation_interval: 1m
tests:
- name: fresh backups stay quiet
  interval: 1m
  input_series:
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="dograh",job="dograh/dograh-db"}
    values: 0+60x99
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="kagent",job="kagent/kagent-db"}
    values: 0+60x99
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="teslamate",job="teslamate/teslamate-db"}
    values: 0+60x99
  alert_rule_test:
  - eval_time: 30m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 30m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
  - eval_time: 31m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 31m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
  - eval_time: 60m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 60m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
- name: verified live age of about 4.1h stays quiet
  interval: 1m
  input_series:
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="dograh",job="dograh/dograh-db"}
    values: -14760+60x79
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="kagent",job="kagent/kagent-db"}
    values: -14760+60x79
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="teslamate",job="teslamate/teslamate-db"}
    values: -14760+60x79
  alert_rule_test:
  - eval_time: 30m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 30m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
  - eval_time: 70m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 70m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
- name: all backups 31h old page after 30m and are not absent
  interval: 1m
  input_series:
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="dograh",job="dograh/dograh-db"}
    values: -111600+0x79
