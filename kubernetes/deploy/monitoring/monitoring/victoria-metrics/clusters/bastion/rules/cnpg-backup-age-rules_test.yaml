    values: -111600+0x79
  - series: cnpg_collector_last_available_backup_timestamp{k8s_cluster="bastion",namespace="teslamate",job="teslamate/teslamate-db"}
    values: -111600+0x79
  alert_rule_test:
  - eval_time: 29m
    alertname: CNPGBackupTooOld
    exp_alerts: []
  - eval_time: 29m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
  - eval_time: 30m
    alertname: CNPGBackupTooOld
    exp_alerts:
    - exp_labels:
        k8s_cluster: bastion
        namespace: dograh
        job: dograh/dograh-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for dograh/dograh-db is older than 30 hours
        description: The last available backup for dograh/dograh-db is more than 30
          hours old and has remained so for 30 minutes. Daily backups run just after
          midnight UTC. Check the ScheduledBackup and the object-store destination.
    - exp_labels:
        k8s_cluster: bastion
        namespace: kagent
        job: kagent/kagent-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for kagent/kagent-db is older than 30 hours
        description: The last available backup for kagent/kagent-db is more than 30
          hours old and has remained so for 30 minutes. Daily backups run just after
          midnight UTC. Check the ScheduledBackup and the object-store destination.
    - exp_labels:
        k8s_cluster: bastion
        namespace: teslamate
        job: teslamate/teslamate-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for teslamate/teslamate-db is older than 30 hours
        description: The last available backup for teslamate/teslamate-db is more
          than 30 hours old and has remained so for 30 minutes. Daily backups run
          just after midnight UTC. Check the ScheduledBackup and the object-store
          destination.
  - eval_time: 30m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
  - eval_time: 60m
    alertname: CNPGBackupTooOld
    exp_alerts:
    - exp_labels:
        k8s_cluster: bastion
        namespace: dograh
        job: dograh/dograh-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for dograh/dograh-db is older than 30 hours
        description: The last available backup for dograh/dograh-db is more than 30
          hours old and has remained so for 30 minutes. Daily backups run just after
          midnight UTC. Check the ScheduledBackup and the object-store destination.
    - exp_labels:
        k8s_cluster: bastion
        namespace: kagent
        job: kagent/kagent-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for kagent/kagent-db is older than 30 hours
        description: The last available backup for kagent/kagent-db is more than 30
          hours old and has remained so for 30 minutes. Daily backups run just after
          midnight UTC. Check the ScheduledBackup and the object-store destination.
    - exp_labels:
        k8s_cluster: bastion
        namespace: teslamate
        job: teslamate/teslamate-db
        severity: warning
        irm_notify: 'true'
      exp_annotations:
        summary: CNPG backup for teslamate/teslamate-db is older than 30 hours
        description: The last available backup for teslamate/teslamate-db is more
          than 30 hours old and has remained so for 30 minutes. Daily backups run
          just after midnight UTC. Check the ScheduledBackup and the object-store
          destination.
  - eval_time: 60m
    alertname: CNPGBackupMetricAbsent
    exp_alerts: []
