---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmalert_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: victoria
  namespace: monitoring
spec:
  # useStrictSecurity: true # enables apparmor, which we can only use after upgrading to talos 1.8.0+
  replicaCount: 1
  evaluationInterval: 1m
  # selectAllByDefault only applies when both selectors are unset. Keep cluster-wide
  # discovery (including kube-system kps VMRules) and skip LogsQL rules, which need
  # VMAlert/victoria-logs.
  selectAllByDefault: true
  ruleNamespaceSelector: {}
  ruleSelector:
    matchExpressions:
      - key: alerting.jtcressy.net/datasource
        operator: NotIn
        values:
          - victorialogs
  externalLabels:
    cluster: "bastion"
  datasource: &vm
    url: http://vmsingle-alerts.monitoring.svc:8429
  remoteRead:
    url: http://vmsingle-victoria.monitoring.svc:8429
  remoteWrite:
    url: http://vmagent-victoria.monitoring.svc:8429
  # VMAlertmanager/local. The previous alertmanager(-local-0..2) names do not resolve.
  notifiers:
    - url: http://vmalertmanager-local.monitoring.svc:9093
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
