---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmalert_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: victoria
  namespace: monitoring
spec:
  # useStrictSecurity: true # enables apparmor, which we can only use after upgrading to talos 1.8.0+
  replicaCount: 1
  evaluationInterval: 1m
  selectAllByDefault: true
  externalLabels:
    cluster: "bastion"
  datasource: &vm
    url: http://vmsingle-alerts.monitoring.svc:8429
  remoteRead:
    url: http://vmsingle-victoria.monitoring.svc:8429
  remoteWrite:
    url: http://vmagent-victoria.monitoring.svc:8429
  # Service rendered by the existing kube-prometheus-stack release.
  # Phase 1 is intake only; see docs/bastion-alerting.md before activation.
  notifiers:
    - url: http://kps-alertmanager.kube-system.svc:9093
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
