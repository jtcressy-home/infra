---
# Inbound URL for Grafana IRM integration C254NSW1QG433
# ("Home infrastructure Alertmanager"). The URL contains a token.
# Joel creates the 1Password item; this file only names it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-irm-alertmanager-bastion
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-irm-alertmanager-bastion
    creationPolicy: Owner
    # Retain applies when the 1Password item disappears. creationPolicy Owner
    # still sets an ownerReference, so deleting this ExternalSecret deletes
    # the Secret with it.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: "{{ .url }}"
        # Sprig trimSuffix (ESO template engine v2, Go text/template).
        # One trailing slash is optional. Result is always <url>/heartbeat/.
        heartbeat_url: '{{ .url | trimSuffix "/" }}/heartbeat/'
  data:
    - secretKey: url
      remoteRef:
        # Item title in vault jtcressy-net-infra (ClusterSecretStore onepassword).
        key: grafana-irm-alertmanager-bastion
        # Field label. Value is the integration's inbound URL, unchanged.
        property: url
