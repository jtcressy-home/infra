apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# VMRules live in rules/ and are not part of this kustomize build.
# victoria-metrics-bastion deploys them from a directory source
# (recurse + include *-rules.yaml). Add an alert by adding a file there.
resources:
- persistence.yaml
- vmsingle.yaml
- vmalert.yaml
- vmagent.yaml
- ingress.yaml
- vmalertmanager.yaml
- externalsecret.yaml
