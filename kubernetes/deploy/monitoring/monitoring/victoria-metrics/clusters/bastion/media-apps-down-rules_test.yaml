# Promtool unit tests for media-apps-down-rules.yaml.
# Omit rule_files. test/vmrules injects the VMRule groups.
evaluation_interval: 1m
tests:
- name: all listed apps have a replica
  interval: 1m
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="sonarr"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="radarr"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="prowlarr"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="sabnzbd"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="navidrome"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="tautulli"}
    values: 1+0x45
  - series: kube_deployment_status_replicas_available{namespace="media",deployment="overseerr"}
    values: 1+0x45
  alert_rule_test:
  - eval_time: 15m
    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 15m
    alertname: OverseerrDown
    exp_alerts: []
  - eval_time: 30m
    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 30m
    alertname: OverseerrDown
    exp_alerts: []
  - eval_time: 40m
    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 40m
    alertname: OverseerrDown
    exp_alerts: []
- name: no series for the listed apps
  interval: 1m
  input_series: []
  alert_rule_test:
