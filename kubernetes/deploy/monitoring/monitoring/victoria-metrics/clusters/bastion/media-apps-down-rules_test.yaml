    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 15m
    alertname: OverseerrDown
    exp_alerts: []
  - eval_time: 30m
    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 30m
    alertname: OverseerrDown
    exp_alerts: []
  - eval_time: 40m
    alertname: MediaAppDown
    exp_alerts: []
  - eval_time: 40m
    alertname: OverseerrDown
