---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: external-dns-sync-stale
  namespace: monitoring
spec:
  groups:
    - name: external-dns-sync-stale
      interval: 1m
      rules:
        # Last successful DNS provider sync older than 30 minutes.
        # irm_notify wakes CASE through the grafana-irm receiver.
        - alert: ExternalDNSSyncStale
          expr: time() - external_dns_controller_last_sync_timestamp_seconds > 1800
          for: 10m
          labels:
            k8s_cluster: bastion
            severity: warning
            irm_notify: "true"
          annotations:
            summary: external-dns last successful sync is older than 30 minutes
            description: external-dns has not completed a successful DNS sync for 30 minutes, and that has continued for 10 minutes. Records from Ingress and Service sources may be stale.
