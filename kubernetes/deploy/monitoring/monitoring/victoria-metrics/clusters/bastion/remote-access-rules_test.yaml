    values: 1+0x20
  - series: kube_statefulset_status_replicas_ready{namespace="tailscale",statefulset="ts-proxy"}
    values: 1+0x20
  - series: kube_daemonset_status_number_available{namespace="kube-system",daemonset="cloudflared"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: TsidpDown
    exp_alerts: []
  - eval_time: 4m
    alertname: SkylightMcpDown
    exp_alerts: []
  - eval_time: 4m
    alertname: TailscaleProxyDown
    exp_alerts: []
