# Promtool unit tests for remote-access-rules.yaml.
# Omit rule_files. test/vmrules injects the VMRule groups.
evaluation_interval: 1m
tests:
- name: "all four workloads healthy"
  interval: 1m
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="tailscale",deployment="tsidp"}
    values: 1+0x20
